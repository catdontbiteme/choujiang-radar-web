<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="抽獎雷達：探索台灣政府、超商與品牌抽獎，查詢獎品、資格與期限。"><title>抽獎雷達｜台灣抽獎活動探索</title><link rel="stylesheet" href="./style.css"><script src="./app.js" defer></script></head>
<body><header><a class="brand" href="./">◉ 抽獎雷達</a><nav><a href="#results">探索活動</a><a href="https://choujiang-radar.catdontbiteme.chatgpt.site/sources">官方來源</a><a href="https://choujiang-radar.catdontbiteme.chatgpt.site/submit">投稿活動</a></nav></header>
<section class="hero"><div><p class="eyebrow">台灣抽獎活動探索</p><h1>你的下一份驚喜，<br><em>在這裡找。</em></h1><p>政府、超商與品牌活動，先看獎品，再查資格與期限。</p></div><div class="stats"><div><strong id="total">—</strong><span>已收錄活動</span></div><div><strong id="prizes">—</strong><span>獎品明細</span></div><div><strong id="checked">—</strong><span>最近查核</span></div></div></section>
<main><div class="search"><label for="query">⌕</label><input id="query" type="search" placeholder="你想抽什麼？搜尋耳機、機票、禮券…" aria-label="搜尋活動、主辦方或獎品"><span>✓ 先核對官方辦法，再收錄</span></div><div class="layout"><aside><div class="filter-title"><h2>篩選條件</h2><button id="reset">清除</button></div><label>地區<select id="region" aria-label="地區"><option value="">全部地區</option></select></label><label>參加成本<select id="cost" aria-label="參加成本"><option value="">不限</option><option value="free">免額外消費</option><option value="purchase">消費／其他成本</option></select></label><label>主辦類型<select id="organizer" aria-label="主辦類型"><option value="">全部類型</option><option>政府</option><option>品牌</option></select></label><label>通路／類別<select id="channel" aria-label="通路／類別"><option value="">所有通路</option></select></label><label>想抽什麼<select id="prize" aria-label="想抽什麼"><option value="">全部獎品</option></select></label><label class="checkbox"><input id="ended" type="checkbox">包含已截止活動</label><p class="hint"><b>期限怎麼看？</b><br>分開記錄消費、登錄、開獎與領獎日期，卡片顯示下一個需要注意的期限。</p></aside>
<section id="results"><div class="shortcuts" aria-label="熱門獎品搜尋"><button data-query="耳機">♫<span>耳機</span></button><button data-query="手機">▣<span>手機</span></button><button data-query="禮券">▤<span>禮券</span></button><button data-query="機票">✈<span>機票</span></button><button data-query="Switch">⊕<span>Switch</span></button><button data-query="現金">＄<span>現金</span></button></div><p class="eyebrow">目前開放參加／登錄</p><div class="results-heading"><h2>探索 <em id="count">—</em> 檔活動</h2><span>最近截止優先</span></div><p id="status" role="status">正在載入活動…</p><div id="cards" class="cards"></div><p class="note">數字為本站收錄量，非全台總數。同一檔跨通路活動不重複計算。獎品圖片為類別示意，實物以官方公告為準。</p><p class="note" id="updated"></p></section></div></main>
<footer><p>抽獎雷達只提供資訊摘要，實際資格與期限以主辦單位最新公告為準。</p><a href="https://choujiang-radar.catdontbiteme.chatgpt.site/submit">投稿／失效回報</a></footer>
<dialog id="detail"><button id="close" class="close" aria-label="關閉活動詳情">✕</button><div id="detail-content"></div></dialog></body></html>
